name: Ticket Monitor

on:
  schedule:
    # PRIMARY cadence comes from an EXTERNAL cron that pings this workflow every
    # 60s (GitHub's own scheduler can't fire faster than ~5 min and is delayed
    # under load). This built-in */5 schedule is just a backstop so coverage
    # degrades to ~5-min if the external pinger ever dies.
    - cron: "*/5 * * * *"

  # The external every-60s cronjob triggers a run via GitHub's API. Support both
  # dispatch endpoints so it works however the cronjob is configured:
  #   • repository_dispatch — POST /repos/<owner>/<repo>/dispatches
  #       body: {"event_type":"poll"}   (no `types:` filter = accept any type)
  #   • workflow_dispatch    — POST /repos/<owner>/<repo>/actions/workflows/monitor.yml/dispatches
  #       body: {"ref":"main"}
  # Either way send headers: Authorization: Bearer <PAT with actions:write>,
  # Accept: application/vnd.github+json. The workflow file must already be on main.
  repository_dispatch:

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (check sites, send no alerts)"
        type: boolean
        default: false
      probe_movie:
        description: "Probe: send a real test alert for a movie on sale NOW (e.g. Masters of the Universe). Leave blank for a normal run."
        type: string
        default: ""
      test_pushover:
        description: "Send a test Pushover emergency alert and exit"
        type: boolean
        default: false
      test_escalation:
        description: "Send the exact 'Dune new showtime on sale' siren and exit"
        type: boolean
        default: false
      test_email:
        description: "Print what the Dune Insider Gmail watch matches now, and exit (sends nothing)"
        type: boolean
        default: false
      discover_amc:
        description: "Print AMC API theatre id + sample showtimes and exit"
        type: boolean
        default: false

# NO concurrency group — deliberately.
#
# There used to be one (group: ticket-monitor, cancel-in-progress: false), on
# the theory that GitHub's queue semantics give you "at most one in-progress +
# one pending, newest ping wins". That holds only while runners are plentiful.
# When GitHub hosted-runner capacity is constrained, a job can sit unassigned
# for ~15 minutes before GitHub gives up with "The job was not acquired by
# Runner of type hosted even after multiple attempts" — and for that entire
# window it OWNS the group. Every 60s ping behind it queues, gets superseded by
# the next ping, and is cancelled. One stall therefore cost 15 minutes of
# blackout instead of one minute. Observed 2026-08-06 during a GitHub Actions
# capacity incident: ~86 of 100 consecutive runs cancelled, ~4 real polls/hour
# instead of 60.
#
# Nothing inside a workflow can shorten that hold (timeout-minutes starts when
# a job is PICKED UP, not when it's queued), so the only fix is to stop letting
# one starved run gate the others. Without a group, a stalled run harms only
# itself and any ping that lands a runner polls immediately.
#
# What the group used to protect is handled elsewhere: git push races between
# overlapping runs are absorbed by the reset + merge_state.py + retry loop in
# the commit step. (Overlap is rare anyway — a poll is ~25s against a 60s ping.)

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    # A normal poll is ~25s wall-clock. This only exists to kill a job wedged
    # in checkout/pip; the poll itself is separately capped at 55s below.
    timeout-minutes: 5

    steps:
      # NOTE: there is deliberately no "skip this run if it sat in the queue"
      # guard here. One was tried and removed the same day — see the commit
      # history. Two reasons it was a bad idea:
      #
      #  1. It silently broke the monitor. `github.run_started_at` expands to an
      #     empty string in this context, and GNU `date -d ""` doesn't error —
      #     it returns midnight today. So the guard computed a ~20h queue age
      #     and skipped the poll on EVERY run, while the job still reported
      #     success. Green checkmarks, zero polling: the exact failure this repo
      #     exists to prevent.
      #  2. It was solving a problem that doesn't occur. The worry was a backlog
      #     of delayed runs draining at once and all alerting off the same
      #     committed state. But GitHub *cancels* runs it can't assign a runner
      #     to (~15 min) rather than running them late, so the backlog never
      #     drains — there is nothing to suppress.
      #
      # If you ever do need queue-age here: `github.run_started_at` is not a
      # usable source, and any check must treat "can't determine the age" as
      # fresh, validating the timestamp's format before handing it to date(1).
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_TOKEN_2: ${{ secrets.APIFY_TOKEN_2 }}
          APIFY_TOKEN_3: ${{ secrets.APIFY_TOKEN_3 }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          AMC_VENDOR_KEY: ${{ secrets.AMC_VENDOR_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          if [ "${{ inputs.discover_amc }}" = "true" ]; then
            python src/main.py --discover-amc
          elif [ "${{ inputs.test_pushover }}" = "true" ]; then
            python src/main.py --test-pushover
          elif [ "${{ inputs.test_escalation }}" = "true" ]; then
            python src/main.py --test-escalation
          elif [ "${{ inputs.test_email }}" = "true" ]; then
            python src/main.py --test-email
          elif [ -n "${{ inputs.probe_movie }}" ]; then
            python src/main.py --probe "${{ inputs.probe_movie }}"
          elif [ "${{ inputs.dry_run }}" = "true" ]; then
            python src/main.py --dry-run
          else
            # An external cron pings this workflow every 60s, so each run is a
            # SINGLE poll. Hard-cap the poll at 55s (< the 1-min ping) so a hung
            # check (slow AMC/IMAP) is killed with headroom and can't bleed into
            # the next minute — the next ping just starts a clean run. `timeout`
            # exits 124 when it kills the process; swallow it (and any error) so
            # one slow/failed poll doesn't red-fail the job.
            timeout 55 python src/main.py || echo "poll timed out/errored — next ping clears it"
          fi

      # Persist state by committing it back. Runs can land close together, so a
      # plain push gets rejected (non-fast-forward) — which previously both
      # failed the run AND dropped state (causing duplicate alerts). Instead:
      # reset to the latest remote, MERGE this run's state in, push, and retry.
      # Never fail the run over this — the next run reconciles via the merge.
      - name: Commit updated state
        if: ${{ github.event_name == 'schedule' || inputs.dry_run != true }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          cp state/seen.json /tmp/our_state.json
          # The API-pull snapshot (data timeline — see src/snapshot.py). This
          # run's pull is the freshest by definition, so it simply overwrites
          # remote's after the reset; no merge needed.
          if [ -f state/snapshot.json ]; then cp state/snapshot.json /tmp/our_snapshot.json; fi
          if [ -f state/SNAPSHOT.md ]; then cp state/SNAPSHOT.md /tmp/our_snapshot.md; fi
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            python3 scripts/merge_state.py /tmp/our_state.json
            if [ -f /tmp/our_snapshot.json ]; then cp /tmp/our_snapshot.json state/snapshot.json; fi
            if [ -f /tmp/our_snapshot.md ]; then cp /tmp/our_snapshot.md state/SNAPSHOT.md; fi
            git add state/
            if git diff --cached --quiet; then
              echo "No state changes to commit."; exit 0
            fi
            git commit -q -m "update state [skip ci]"
            if git push -q origin HEAD:main; then
              echo "State pushed (attempt $i)."; exit 0
            fi
            echo "Push race; retrying ($i)..."; sleep 2
          done
          echo "WARN: could not persist state after retries; next run reconciles."
          exit 0

      # Telegram ping if ANY step above failed (a crash, or the pip install
      # breaking) — so an infrastructure-level failure isn't silent.
      # App-level problems (AMC unreachable / layout changed) are alerted from
      # within the monitor itself; this is the catch-all backstop.
      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=⚠️ ticket-monitor run FAILED (infrastructure/step error). Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            >/dev/null || true
